<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>剪刀石頭布</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a7fc1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="剪刀石頭布">
  <link rel="apple-touch-icon" href="rps-icon-180.png">
  <link rel="icon" href="rps-icon-192.png">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: repeating-linear-gradient(90deg, #a8d8f0 0 60px, #bfe3f5 60px 110px, #9fcfe8 110px 130px, #bfe3f5 130px 180px);
      user-select: none; -webkit-user-select: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button { font-family: inherit; }
    .screen { height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; padding: 90px 16px 16px; position: relative; }
    .screen.active { display: flex; }

    .round-btn {
      position: absolute; top: 16px; left: 16px; z-index: 5;
      width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff;
      background: #f06a1f; color: #fff; font-size: 30px; text-decoration: none;
      box-shadow: 0 3px 6px rgba(0,0,0,.25); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { margin: 0 0 10px; font-size: clamp(36px, 6vw, 52px); color: #fff; text-shadow: 0 3px 0 #2a7fc1, 0 6px 10px rgba(0,0,0,.2); }
    h2 { margin: 0; font-size: clamp(28px, 4.5vw, 40px); color: #1d4f7a; }

    .big-btn {
      width: min(440px, 90vw); padding: 18px; font-size: 30px; font-weight: bold;
      border: 5px solid #f06a1f; border-radius: 20px; background: #fdf6c3; color: #e0561a;
      box-shadow: 0 4px 0 #c84f15; cursor: pointer;
    }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c84f15; }
    .big-btn small { display: block; font-size: 17px; color: #8a6d3b; font-weight: normal; }

    /* 手勢卡片 */
    .hands { display: flex; gap: 3vw; justify-content: center; flex-wrap: wrap; }
    .hand {
      width: clamp(130px, 24vw, 220px); aspect-ratio: 1; border-radius: 28px; border: 6px solid #2a7fc1;
      background: #fff; box-shadow: 0 5px 0 #1d5f94; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: clamp(64px, 12vw, 120px); line-height: 1; padding: 0;
    }
    .hand span { font-size: clamp(20px, 3vw, 30px); font-weight: bold; color: #1d4f7a; margin-top: 8px; }
    .hand:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d5f94; }
    .hand.pick { border-color: #f06a1f; box-shadow: 0 5px 0 #c84f15; background: #fff4d6; }

    .panel { width: min(760px, 94vw); background: #fffdf2; border-radius: 18px; padding: 16px 20px; text-align: center; box-shadow: 0 3px 8px rgba(0,0,0,.15); font-size: clamp(22px, 3.2vw, 32px); min-height: 1.6em; }
    .panel b { color: #e0561a; }

    /* 學規則：循環圖 */
    .cycle { display: flex; align-items: center; gap: 1.5vw; font-size: clamp(40px, 7vw, 72px); background: #fffdf2; padding: 10px 24px; border-radius: 60px; }
    .cycle .arrow { font-size: .5em; color: #e0561a; text-align: center; line-height: 1.1; }
    .cycle .arrow small { display: block; font-size: 16px; color: #8a6d3b; }

    /* 學規則：一次只學一條，畫面只有兩隻手 */
    .steps { display: flex; gap: 16px; min-height: 30px; align-items: center; }
    .step { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid #2a7fc1; opacity: .6; }
    .step.on { background: #f06a1f; border-color: #c84f15; opacity: 1; transform: scale(1.35); }
    .step.done { background: #3ba53b; border-color: #2f7d2f; opacity: 1; }
    .duel { display: flex; gap: clamp(24px, 9vw, 130px); align-items: center; justify-content: center; }
    .lhand {
      position: relative; width: min(30vw, 34vh); min-width: 130px; aspect-ratio: 1; border-radius: 34px; border: 8px solid #2a7fc1;
      background: #fff; box-shadow: 0 6px 0 #1d5f94; cursor: pointer; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: min(17vw, 19vh); line-height: 1; transition: transform .5s, opacity .5s, box-shadow .3s;
    }
    .lhand span { font-size: min(4.2vw, 5vh); font-weight: bold; color: #1d4f7a; margin-top: 6px; }
    .lhand.win { border-color: #3ba53b; box-shadow: 0 0 0 10px rgba(59,165,59,.3), 0 6px 0 #2f7d2f; }
    .lhand.win::before { content: '⭐'; position: absolute; top: -34px; font-size: 54px; }
    .lhand.lose { opacity: .3; transform: scale(.82); }
    .lhand.bump { animation: lunge 1s ease-in-out; }
    .lhand.no { opacity: .35; animation: shakeHand2 .4s; }
    .lhand.hint { animation: pulseHand .8s infinite; border-color: #f06a1f; }
    @keyframes lunge { 0% { transform: translateX(0); } 30% { transform: translateX(-26px); } 55% { transform: translateX(min(9vw, 60px)); } 100% { transform: translateX(0); } }
    @keyframes shakeHand2 { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    @keyframes pulseHand { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    .bigword { font-size: clamp(44px, 9vw, 92px); font-weight: bold; color: #1d4f7a; min-height: 1.25em; text-align: center; }
    .bigword b { color: #e0561a; margin: 0 .15em; }
    .lnext { font-size: clamp(28px, 4.5vw, 42px); font-weight: bold; padding: 14px 44px; border-radius: 24px; border: 6px solid #f06a1f; background: #fdf6c3; color: #e0561a; box-shadow: 0 5px 0 #c84f15; cursor: pointer; }
    .lnext:active { transform: translateY(4px); box-shadow: 0 1px 0 #c84f15; }
    #lDone { display: none; flex-direction: column; align-items: center; gap: 18px; }
    #lDone .star { font-size: clamp(90px, 16vw, 150px); line-height: 1; }

    /* 對戰 */
    .arena { display: flex; align-items: center; gap: 4vw; }
    .side { text-align: center; }
    .side .who { font-size: clamp(22px, 3vw, 30px); font-weight: bold; color: #1d4f7a; }
    .show {
      width: clamp(140px, 24vw, 230px); aspect-ratio: 1; border-radius: 50%; background: #fff; border: 6px solid #2a7fc1;
      display: flex; align-items: center; justify-content: center; font-size: clamp(80px, 13vw, 130px);
    }
    .show.win { border-color: #3ba53b; box-shadow: 0 0 0 8px rgba(59,165,59,.3); }
    .show.lose { opacity: .55; }
    .vs { font-size: clamp(32px, 5vw, 52px); font-weight: bold; color: #e0561a; }
    .shaking { animation: shakeHand .25s infinite alternate; }
    @keyframes shakeHand { from { transform: translateY(-10px) rotate(-8deg); } to { transform: translateY(10px) rotate(8deg); } }
    .score-line { font-size: clamp(20px, 3vw, 28px); color: #1d4f7a; }

    /* 誰贏了 */
    .quiz-row { display: flex; gap: 2vw; align-items: stretch; }
    .quiz-row .show { cursor: pointer; border-radius: 28px; }
    .quiz-row .show:active { transform: scale(.96); }
    .tie-btn { align-self: center; font-size: clamp(26px, 4vw, 38px); font-weight: bold; padding: 14px 22px; border-radius: 20px; border: 5px solid #f06a1f; background: #fdf6c3; color: #e0561a; box-shadow: 0 4px 0 #c84f15; cursor: pointer; }
    .tie-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c84f15; }
    .labels { display: flex; justify-content: space-between; width: min(700px, 94vw); font-size: clamp(18px, 2.6vw, 24px); color: #1d4f7a; font-weight: bold; }
    #stars { font-size: 34px; }

    #toast { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%) scale(0); font-size: 120px; pointer-events: none; transition: transform .25s; z-index: 10; }
    #toast.show { transform: translate(-50%,-50%) scale(1); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; }
    .overlay .card { background: #fdf8dc; border: 6px solid #f06a1f; border-radius: 24px; padding: 30px 40px; text-align: center; }
    .overlay h2 { color: #e0561a; font-size: 44px; }
    .overlay .big-stars { font-size: 60px; margin: 10px 0; }
    .overlay p { font-size: 22px; margin: 6px 0 20px; }

    /* 高度較矮時（例如電腦小視窗）把圖縮小 */
    @media (max-height: 700px) {
      .screen { gap: 1.5vh; padding-top: 80px; }
      .show { width: min(24vw, 22vh); font-size: min(13vw, 12vh); }
      .hand { width: min(24vw, 20vh); font-size: min(12vw, 10vh); }
    }
  </style>
</head>
<body>

<!-- ============ 選單 ============ -->
<div class="screen active" id="menu">
  <a href="https://alphones66.github.io/clock-practice/" class="round-btn" aria-label="回時鐘練習">🏠</a>
  <h1>✊✌️✋ 剪刀石頭布</h1>
  <button class="big-btn" data-go="learn">學規則<small>誰會贏誰？</small></button>
  <button class="big-btn" data-go="play">猜拳對戰<small>跟電腦比一比</small></button>
  <button class="big-btn" data-go="quiz">誰贏了？<small>看圖判斷輸贏</small></button>
</div>

<!-- ============ 學規則（一次只學一條）============ -->
<div class="screen" id="learn">
  <button class="round-btn back">←</button>
  <div class="steps" id="steps"></div>
  <div class="duel" id="duel">
    <button class="lhand" id="lhA"></button>
    <button class="lhand" id="lhB"></button>
  </div>
  <div class="bigword" id="bigWord"></div>
  <button class="lnext" id="lNext" style="visibility:hidden">換我試試看 ▶</button>
  <div id="lDone">
    <div class="star">🌟</div>
    <h2>三個都學會了！</h2>
    <button class="big-btn" id="lAgain">再學一次</button>
  </div>
</div>

<!-- ============ 猜拳對戰 ============ -->
<div class="screen" id="play">
  <button class="round-btn back">←</button>
  <div class="score-line">你 <b id="pWin">0</b> 勝 ・ 電腦 <b id="cWin">0</b> 勝 ・ 平手 <b id="tie">0</b></div>
  <div class="arena">
    <div class="side"><div class="who">你</div><div class="show" id="pShow">❔</div></div>
    <div class="vs">VS</div>
    <div class="side"><div class="who">電腦</div><div class="show" id="cShow">❔</div></div>
  </div>
  <div class="panel" id="playText">選一個手勢出拳！</div>
  <div class="hands" id="playHands">
    <button class="hand" data-h="rock">✊<span>石頭</span></button>
    <button class="hand" data-h="scissors">✌️<span>剪刀</span></button>
    <button class="hand" data-h="paper">✋<span>布</span></button>
  </div>
</div>

<!-- ============ 誰贏了 ============ -->
<div class="screen" id="quiz">
  <button class="round-btn back">←</button>
  <div id="stars"></div>
  <h2>誰贏了？點贏的那一邊</h2>
  <div class="labels"><span>左邊</span><span id="qProgress"></span><span>右邊</span></div>
  <div class="quiz-row">
    <div class="show" id="qLeft">✊</div>
    <button class="tie-btn" id="qTie">平手</button>
    <div class="show" id="qRight">✌️</div>
  </div>
  <div class="panel" id="quizText"></div>
</div>

<div id="toast"></div>

<div class="overlay" id="result">
  <div class="card">
    <h2>完成了！</h2>
    <div class="big-stars" id="resultStars"></div>
    <p id="resultText"></p>
    <button class="big-btn" id="again">再玩一次</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---------- 規則 ----------
const H = {
  rock:     { emoji: '✊', name: '石頭', beats: 'scissors' },
  scissors: { emoji: '✌️', name: '剪刀', beats: 'paper' },
  paper:    { emoji: '✋', name: '布',   beats: 'rock' },
};
const KEYS = Object.keys(H);
// 贏的理由（贏家 → 說明）
const REASON = {
  rock: '石頭把剪刀敲壞了',
  scissors: '剪刀把布剪開了',
  paper: '布把石頭包起來了',
};
const loserOf = k => H[k].beats;
const winnerOf = k => KEYS.find(x => H[x].beats === k);
// 回傳 1 = a 贏、-1 = b 贏、0 = 平手
const judge = (a, b) => a === b ? 0 : H[a].beats === b ? 1 : -1;
const rand = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- 語音 ----------
let zhVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => v.lang === 'zh-TW') || vs.find(v => v.lang.startsWith('zh')) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate = 0.85) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    if (zhVoice) u.voice = zhVoice;
    u.rate = rate;
    const fallback = setTimeout(resolve, 1500 + text.length * 400);
    u.onend = u.onerror = () => { clearTimeout(fallback); resolve(); };
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---------- 音效 ----------
let actx;
function beep(notes) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    notes.forEach(([freq, start, dur]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'triangle';
      g.gain.setValueAtTime(0.3, actx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur);
    });
  } catch (_) {}
}
const soundOk = () => beep([[523, 0, .15], [659, .12, .15], [784, .24, .3]]);
const soundNg = () => beep([[220, 0, .25], [180, .2, .35]]);
const soundTie = () => beep([[440, 0, .2], [440, .22, .2]]);
const soundPop = () => beep([[880, 0, .08]]);

function toast(txt) {
  const t = $('toast');
  t.textContent = txt;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 700);
}
const PRAISES = ['好極了！', '做得好！', '你好棒！', '做對了！'];

// ---------- 畫面切換 ----------
let session = 0;   // 切換畫面時 +1，取消還在進行的動畫／語音流程
function go(id) {
  session++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  $('result').style.display = 'none';
  if (id === 'play') resetPlay();
  if (id === 'quiz') startQuiz();
  if (id === 'learn') startLearn();
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => go('menu')));

// ============ 學規則：一次只學一條 ============
// 每條規則：先看一次（贏的那隻手撞過去，輸的那隻變淡）→ 自己點三次「哪一個贏」→ 學會了才換下一條
const RULES = [['rock', 'scissors'], ['scissors', 'paper'], ['paper', 'rock']];   // [贏的, 輸的]
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let ruleIdx = 0, lphase = 'watch', trial = 0, trialSides = [], lLocked = true;
const wordHTML = (w, l) => `${H[w].name}<b>贏</b>${H[l].name}`;

function renderSteps() {
  $('steps').innerHTML = RULES.map((_, i) => `<span class="step${i < ruleIdx ? ' done' : i === ruleIdx ? ' on' : ''}"></span>`).join('');
}
function setHands(left, right) {
  [['lhA', left], ['lhB', right]].forEach(([id, k]) => { const el = $(id); el.dataset.h = k; el.innerHTML = `${H[k].emoji}<span>${H[k].name}</span>`; el.className = 'lhand'; });
}
function showLearn(on) {
  $('duel').style.display = on ? 'flex' : 'none';
  $('bigWord').style.display = on ? 'block' : 'none';
  $('lNext').style.display = on ? 'block' : 'none';
  $('steps').style.display = on ? 'flex' : 'none';
  $('lDone').style.display = on ? 'none' : 'flex';
}

function startLearn() { ruleIdx = 0; showLearn(true); watchRule(); }

async function watchRule() {            // 先看一次：贏的在左邊，撞過去，輸的變淡
  const s = session, [w, l] = RULES[ruleIdx];
  lphase = 'watch'; lLocked = true;
  renderSteps(); setHands(w, l);
  $('bigWord').innerHTML = ''; $('lNext').style.visibility = 'hidden';
  await wait(600); if (s !== session) return;
  soundPop(); $('lhA').classList.add('bump');
  await wait(550); if (s !== session) return;
  beep([[330, 0, .12]]); $('lhB').classList.add('lose');
  await wait(500); if (s !== session) return;
  $('lhA').classList.remove('bump'); $('lhA').classList.add('win');
  $('bigWord').innerHTML = wordHTML(w, l);
  await say(`${H[w].name}，贏，${H[l].name}。`, 0.8);
  if (s !== session) return;
  lLocked = false; $('lNext').style.visibility = 'visible';   // 想再看一次：點任何一隻手；準備好了：按「換我試試看」
}

function startTry() {                   // 自己點三次
  lphase = 'try'; trial = 0;
  trialSides = shuffle([true, false, Math.random() < .5]);   // 贏的那隻在左邊還是右邊：三題一定左右都會出現
  nextTrial();
}
function nextTrial() {
  const [w, l] = RULES[ruleIdx];
  lLocked = false; $('lNext').style.visibility = 'hidden';
  const winLeft = trialSides[trial];
  setHands(winLeft ? w : l, winLeft ? l : w);
  $('bigWord').textContent = '哪一個贏？';
  if (trial === 0) document.querySelector(`#duel .lhand[data-h="${w}"]`).classList.add('hint');   // 第一次有提示：贏的那隻一直閃
  say('哪一個贏？');
}

async function ruleDone() {
  const s = session;
  ruleIdx++;
  renderSteps(); toast('🎉'); soundOk();
  await say(PRAISES[Math.floor(Math.random() * PRAISES.length)]);
  await wait(500); if (s !== session) return;
  if (ruleIdx >= RULES.length) {
    showLearn(false); soundOk();
    say('三個都學會了！你好棒！');
  } else {
    watchRule();
  }
}

$('duel').addEventListener('click', async e => {
  const b = e.target.closest('.lhand');
  if (!b || lLocked) return;
  const s = session, [w, l] = RULES[ruleIdx];
  if (lphase === 'watch') return watchRule();      // 點手＝再看一次
  if (b.dataset.h === w) {
    lLocked = true;
    document.querySelectorAll('#duel .lhand').forEach(x => x.classList.remove('hint'));
    b.classList.add('win');
    document.querySelector(`#duel .lhand[data-h="${l}"]`).classList.add('lose');
    soundOk();
    $('bigWord').innerHTML = wordHTML(w, l);
    await say(`${H[w].name}，贏，${H[l].name}。`, 0.8);
    await wait(500); if (s !== session) return;
    trial++;
    if (trial < 3) nextTrial(); else ruleDone();
  } else {
    // 答錯不扣分、沒有難過的聲音：輕輕搖一下，贏的那隻開始閃
    b.classList.add('no');
    document.querySelector(`#duel .lhand[data-h="${w}"]`).classList.add('hint');
    say('再試試看');
  }
});
$('lNext').addEventListener('click', () => { if (!lLocked && lphase === 'watch') startTry(); });
$('lAgain').addEventListener('click', startLearn);

// ============ 猜拳對戰 ============
let pWin = 0, cWin = 0, ties = 0, playing = false;
function resetPlay() {
  pWin = cWin = ties = 0; playing = false;
  updatePlayScore();
  $('pShow').textContent = '❔'; $('cShow').textContent = '❔';
  $('pShow').className = 'show'; $('cShow').className = 'show';
  $('playText').textContent = '選一個手勢出拳！';
  say('選一個手勢出拳');
}
function updatePlayScore() {
  $('pWin').textContent = pWin; $('cWin').textContent = cWin; $('tie').textContent = ties;
}

document.querySelectorAll('#playHands .hand').forEach(b => b.addEventListener('click', async () => {
  if (playing) return;
  playing = true;
  const s = session, p = b.dataset.h, c = rand(KEYS);
  const pS = $('pShow'), cS = $('cShow');
  pS.className = 'show shaking'; cS.className = 'show shaking';
  pS.textContent = '✊'; cS.textContent = '✊';

  // 喊口令：剪刀、石頭、布！
  for (const w of ['剪刀', '石頭', '布']) {
    $('playText').textContent = w + '…';
    soundPop();
    say(w, 1.1);
    await wait(650);
    if (s !== session) return;
  }

  pS.className = 'show'; cS.className = 'show';
  pS.textContent = H[p].emoji; cS.textContent = H[c].emoji;
  const r = judge(p, c);
  let text, speech;
  if (r === 0) {
    ties++; soundTie();
    text = `都出 ${H[p].name}，<b>平手！</b>`;
    speech = `都出${H[p].name}，平手！再來一次`;
  } else {
    const w = r > 0 ? p : c, l = r > 0 ? c : p;
    (r > 0 ? pS : cS).classList.add('win');
    (r > 0 ? cS : pS).classList.add('lose');
    if (r > 0) { pWin++; soundOk(); toast('🎉'); } else { cWin++; soundNg(); }
    text = `${REASON[w]}，<b>${r > 0 ? '你贏了！' : '電腦贏了！'}</b>`;
    speech = `${H[w].name}贏${H[l].name}，${REASON[w]}。${r > 0 ? '你贏了！' : '電腦贏了，再試一次'}`;
  }
  updatePlayScore();
  $('playText').innerHTML = text;
  await say(speech);
  if (s === session) playing = false;
}));

// ============ 誰贏了 ============
const QUESTIONS = 10;
let qIndex = 0, qOk = 0, qNg = 0, qL, qR, qLocked = false;
const starCount = () => qNg === 0 ? 4 : qNg <= 2 ? 3 : qNg <= 4 ? 2 : 1;
const starText = n => '⭐'.repeat(n) + '☆'.repeat(4 - n);

function startQuiz() {
  qIndex = qOk = qNg = 0;
  nextQuestion();
}
function nextQuestion() {
  // 大約 1/5 的題目是平手，其餘有輸贏
  qL = rand(KEYS);
  qR = Math.random() < 0.2 ? qL : rand(KEYS.filter(k => k !== qL));
  $('qLeft').textContent = H[qL].emoji;
  $('qRight').textContent = H[qR].emoji;
  $('qLeft').className = 'show'; $('qRight').className = 'show';
  $('quizText').textContent = `左邊出${H[qL].name}，右邊出${H[qR].name}`;
  $('qProgress').textContent = `第 ${qIndex + 1} / ${QUESTIONS} 題`;
  $('stars').textContent = starText(starCount());
  qLocked = false;
  say(`左邊出${H[qL].name}，右邊出${H[qR].name}，誰贏了？`);
}

async function answer(choice) {   // choice: 1 左、-1 右、0 平手
  if (qLocked) return;
  const s = session, correct = judge(qL, qR);
  if (choice === correct) {
    qLocked = true; qOk++; soundOk(); toast('🎉');
    if (correct !== 0) {
      $(correct > 0 ? 'qLeft' : 'qRight').classList.add('win');
      $(correct > 0 ? 'qRight' : 'qLeft').classList.add('lose');
    }
    const w = correct > 0 ? qL : qR;
    $('quizText').innerHTML = correct === 0 ? '兩邊一樣，<b>平手！</b>' : `${REASON[w]}，<b>${correct > 0 ? '左邊' : '右邊'}贏！</b>`;
    await wait(400);
    await say(rand(PRAISES) + (correct === 0 ? '兩邊一樣，是平手' : REASON[w]));
    await wait(300);
    if (s !== session) return;
    qIndex++;
    if (qIndex >= QUESTIONS) showResult(); else nextQuestion();
  } else {
    qNg++; soundNg(); toast('❌');
    $('stars').textContent = starText(starCount());
    say('再想想看');
  }
}
$('qLeft').addEventListener('click', () => answer(1));
$('qRight').addEventListener('click', () => answer(-1));
$('qTie').addEventListener('click', () => answer(0));

function showResult() {
  $('resultStars').textContent = starText(starCount());
  $('resultText').textContent = `答對 ${qOk} 題，答錯 ${qNg} 次`;
  $('result').style.display = 'flex';
  say(`完成了！你得到${starCount()}顆星星`);
}
$('again').addEventListener('click', () => go('quiz'));

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js');
}
</script>
